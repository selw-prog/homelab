apiVersion: v1
kind: Service
metadata:
  name: crucial-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: crucial-server
  ports:
    # Minecraft Game Traffic: Connect via [Your-K3s-IP]:30001
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30001
      protocol: TCP
    # Metrics Traffic: Used by Vector/VictoriaMetrics
    - name: metrics
      port: 19565
      targetPort: 19565
      protocol: TCP

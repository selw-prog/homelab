apiVersion: v1
kind: Service
metadata:
  name: vanilla-paper-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: vanilla-paper-server
  ports:
    # Minecraft Game Traffic: Connect via [Your-K3s-IP]:30002
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30002
      protocol: TCP
    # Metrics Traffic: Used by Vector/VictoriaMetrics
    - name: metrics
      port: 19566
      targetPort: 19566
      protocol: TCP

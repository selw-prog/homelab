apiVersion: v1
kind: Service
metadata:
  name: home-assistant-service
  namespace: web
spec:
  type: NodePort
  selector:
    app: home-assistant
  ports:
    # Web UI: [K3s-Node-IP]:30003 — DNAT this NodePort on the MikroTik hEX
    # for LAN/VPN reachability into VLAN 20.
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30003
      protocol: TCP

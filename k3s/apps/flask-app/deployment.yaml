apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gunicorn
          image: flask-app:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "app:create_app()"]
          ports:
            - containerPort: 8000
              name: gunicorn
          envFrom:
            - secretRef:
                name: flask-app-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: default.conf

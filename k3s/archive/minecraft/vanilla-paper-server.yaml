# ARCHIVED 2026-11-19 — exported from live cluster, telemetry (JMX exporter) removed.
# World data: gdrive:MinecraftArchive/vanilla-paper_final_*.tar.gz
# Restore: apply namespace + this file, extract the archive into the new PVC, then scale to 1.
# Note: requests 4Gi RAM — the k3s VM must be sized for it before starting.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanilla-paper-pvc
  namespace: minecraft
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vanilla-paper-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: vanilla-paper-server
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30002
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vanilla-paper-server
  namespace: minecraft
  labels:
    app: vanilla-paper-server
spec:
  replicas: 0
  serviceName: vanilla-paper-service
  selector:
    matchLabels:
      app: vanilla-paper-server
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: vanilla-paper-server
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          env:
            - { name: EULA, value: "TRUE" }
            - { name: TYPE, value: PAPER }
            - { name: VERSION, value: LATEST }
            - { name: ONLINE_MODE, value: "TRUE" }
            - { name: MEMORY, value: 4G }
            - { name: USE_AIKAR_FLAGS, value: "TRUE" }
            - { name: MOTD, value: "Welcome to High-Performance Paper Vanilla!" }
            - { name: DIFFICULTY, value: normal }
          ports:
            - { name: minecraft, containerPort: 25565, protocol: TCP }
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { cpu: "3", memory: 5632Mi }
          volumeMounts:
            - { name: vanilla-data, mountPath: /data }
      volumes:
        - name: vanilla-data
          persistentVolumeClaim:
            claimName: vanilla-paper-pvc

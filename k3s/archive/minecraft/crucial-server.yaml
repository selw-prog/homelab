# ARCHIVED 2026-11-19 — exported from live cluster, telemetry (JMX exporter) removed.
# World data: gdrive:MinecraftArchive/crucial_final_*.tar.gz
# Restore: apply namespace + this file, extract the archive into the new PVC, then scale to 1.
# Note: requests 5Gi RAM — the k3s VM must be sized for it before starting.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crucial-data-pvc
  namespace: minecraft
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: crucial-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: crucial-server
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30001
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crucial-server
  namespace: minecraft
  labels:
    app: crucial-server
spec:
  replicas: 0
  serviceName: crucial-service
  selector:
    matchLabels:
      app: crucial-server
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: crucial-server
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java11
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          env:
            - { name: EULA, value: "TRUE" }
            - { name: TYPE, value: AUTO_CURSEFORGE }
            - { name: CF_SLUG, value: crucial-2 }
            - { name: VERSION, value: "1.16.5" }
            - { name: FORGE_VERSION, value: "36.2.39" }
            - { name: MEMORY, value: 5G }
            - name: JVM_XX_OPTS
              value: >-
                -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
                -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
                -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1ReservePercent=20
                -XX:G1HeapRegionSize=8m -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15
            - { name: MOTD, value: "Welcome to Crucial 2 Vanilla+!" }
            - { name: DIFFICULTY, value: normal }
          ports:
            - { name: minecraft, containerPort: 25565, protocol: TCP }
          resources:
            requests: { cpu: 500m, memory: 5Gi }
            limits: { cpu: "3", memory: 6656Mi }
          volumeMounts:
            - { name: crucial-data, mountPath: /data }
      volumes:
        - name: crucial-data
          persistentVolumeClaim:
            claimName: crucial-data-pvc

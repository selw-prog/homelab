apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v0.34.0-victorialogs
          args:
            - "-httpListenAddr=:9428"
            - "-storageDataPath=/storage"
            - "-retentionPeriod=14d"
            # Removed invalid -lokiListenAddr flag entirely!
          ports:
            - containerPort: 9428
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - mountPath: /storage
              name: vl-storage
      volumes:
        - name: vl-storage
          persistentVolumeClaim:
            claimName: vl-storage-pvc

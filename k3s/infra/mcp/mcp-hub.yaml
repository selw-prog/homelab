apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-hub
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-hub
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-hub
subjects:
  - kind: ServiceAccount
    name: mcp-hub
    namespace: mcp
roleRef:
  kind: ClusterRole
  name: mcp-hub
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-hub
  template:
    metadata:
      labels:
        app: mcp-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mcp-hub
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: mcp-hub
          image: ghcr.io/selw-prog/mcp-hub:latest
          imagePullPolicy: Always
          # Assumes the image's default ENTRYPOINT/CMD starts the MCP server itself.
          # Override with `command:` here if the image needs an explicit run mode.
          ports:
            - containerPort: 8080
              name: mcp
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
          # Credentials for the upstream targets this hub inventories/health-checks
          # (Proxmox API token, k3s kubeconfig, RouterOS creds, etc.) — populate
          # mcp-hub-secret manually, it is intentionally not committed to this repo.
          envFrom:
            - secretRef:
                name: mcp-hub-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

        - name: mcp-hub-web
          image: ghcr.io/selw-prog/mcp-hub:latest
          imagePullPolicy: Always
          # Same image, different run mode — swap for the real entrypoint/command
          # that starts the Flask dashboard (e.g. a gunicorn invocation like flask-app's).
          command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "dashboard:create_app()"]
          ports:
            - containerPort: 8000
              name: web
          env:
            # Same pod/network namespace as the mcp-hub container — talk to it over localhost.
            - name: MCP_HUB_API_URL
              value: "http://localhost:8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub-service
  namespace: mcp
spec:
  type: NodePort
  selector:
    app: mcp-hub
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
      nodePort: 30090
      protocol: TCP
    - name: web
      port: 8000
      targetPort: 8000
      nodePort: 30091
      protocol: TCP

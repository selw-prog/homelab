apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.101.0
          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod=14d"
            # Note: Do not put -lokiListenAddr here, as this is the standard metrics TSDB!
          ports:
            - containerPort: 8428
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - mountPath: /storage
              name: vm-storage
      volumes:
        - name: vm-storage
          persistentVolumeClaim:
            claimName: vm-storage-pvc

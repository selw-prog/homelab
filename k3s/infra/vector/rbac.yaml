apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["list", "watch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-agent
subjects:
  - kind: ServiceAccount
    name: vector-agent
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: vector-agent
  apiGroup: rbac.authorization.k8s.io

